services:
  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
